services:
  codex-helper:
    build:
      context: .
      args:
        APP_VERSION: dev
    image: codex-helper:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - codex-helper-data:/data
    environment:
      LISTEN_ADDR: ":8080"
      TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-}"
volumes:
  codex-helper-data:
